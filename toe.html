<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="tacstyle.css">
  <script src="tic.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>TIC TAC TOE</h1>
      <!-- Player Name Inputs -->
      <div class="name-inputs">
        <input type="text" id="player1-name" placeholder="Player 1 (X)" value="Player 1">
        <input type="text" id="player2-name" placeholder="Player 2 (O)" value="Player 2">
        <button id="start-btn" class="btn-small">Set Names</button>
      </div>
      <p id="status-display" class="status">TURN: Player 1 (X)</p>
    </header>

    <div id="board" class="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <button id="restart-btn" class="btn">Restart Game</button>
  </main>
</body>
</html>
