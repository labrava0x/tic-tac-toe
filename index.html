<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Expansion: Tic Tac Toe (JJK Edition)</title>
    <link rel="stylesheet" href="gojostyle.css">
</head>
<body>

    <!-- GOJO SILHOUETTE (UNTOUCHED & LOCKED IN) -->
    <div class="gojo-silhouette">
        <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
            <path d="M 120,210 C 100,140 130,80 180,70 L 200,110 L 230,40 L 260,100 L 300,50 L 320,120 L 370,80 L 360,150 L 400,160 L 370,210 C 300,220 200,220 120,210 Z" fill="#FFFFFF" />
            <path d="M 115,260 C 180,240 320,240 375,260 L 365,320 C 320,300 180,300 125,320 Z" fill="#000000" />
        </svg>
    </div> 

    <!-- MAIN APP WRAPPER -->
    <div class="app-wrapper">

        <!-- MAIN GAME CONTAINER -->
        <div class="game-container">
            <h1>DOMAIN EXPANSION</h1>
            <p class="subtitle">Jujutsu Kaisen Tic Tac Toe</p>
            
            <!-- Player Name Inputs & Controls -->
            <div class="controls">
                <div class="input-group">
                    <input type="text" id="player1" placeholder="Player 1 Name" value="Sorcerer">
                    <input type="text" id="player2" placeholder="Player 2 Name" value="Cursed King">
                </div>
                
                <!-- Character, Slot & Language Selection Dropdowns -->
                <div class="select-group" style="display: flex; gap: 10px; margin-bottom: 12px; justify-content: center; flex-wrap: wrap;">
                    <select id="char-select" style="background: #1e1b4b; color: #c084fc; border: 1px solid #4c1d95; padding: 6px 12px; border-radius: 6px; font-family: monospace;">
                        <option value="gojo">Play as Gojo (♾️)</option>
                        <option value="sukuna">Play as Sukuna (👹)</option>
                    </select>
                    <select id="slot-select" style="background: #1e1b4b; color: #c084fc; border: 1px solid #4c1d95; padding: 6px 12px; border-radius: 6px; font-family: monospace;">
                        <option value="p1">Play as Player 1 (Goes 1st)</option>
                        <option value="p2">Play as Player 2 (Goes 2nd)</option>
                    </select>
                    <select id="lang-select" style="background: #1e1b4b; color: #c084fc; border: 1px solid #4c1d95; padding: 6px 12px; border-radius: 6px; font-family: monospace;">
                        <option value="en">English</option>
                        <option value="ja">日本語 (Japanese)</option>
                        <option value="es">Español (Spanish)</option>
                        <option value="de">Deutsch (German)</option>
                        <option value="ru">Русский (Russian)</option>
                        <option value="zh">中文 (Chinese)</option>
                        <option value="ko">한국어 (Korean)</option>
                        <option value="tr">Türkçe (Turkish)</option>
                        <option value="id">Bahasa Indonesia (Indonesian)</option>
                        <option value="fr">Français (French)</option>
                    </select>
                </div>

                <div class="button-group">
                    <button id="start-btn">Open Domain</button>
                    <button id="save-game-btn">Save Game</button>
                    <button id="save-btn">RESET CLASH</button>
                </div>
            </div>

            <!-- Cursed Scoreboard Display -->
            <div id="scoreboard" class="scoreboard" style="display: flex; justify-content: space-between; align-items: center; background: rgba(30, 27, 46, 0.8); border: 1px solid rgba(147, 51, 234, 0.3); border-radius: 8px; padding: 8px 16px; margin-bottom: 1rem; font-family: monospace; font-size: 0.85rem; color: #c084fc;">
                <span id="p1-score-label">Sorcerer: 0 / 3</span>
                <span style="color: #9ca3af; font-weight: bold;">VS</span>
                <span id="p2-score-label">Cursed King: 0 / 3</span>
            </div>

            <!-- Dynamic Game Message Banner -->
            <div id="message" class="message">Select your fighter, enter names, choose your language, and press 'Open Domain' to begin the clash.</div>

            <!-- Cursed Energy Timer Display -->
            <div id="timer-display" class="timer-display" style="color: #c084fc; font-family: monospace; font-size: 0.9rem; margin-top: -10px; margin-bottom: 15px; text-align: center; display: none;">Cursed Energy Countdown: <span id="time-left">15</span>s</div>

            <!-- 3x3 Domain Grid -->
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </div>

        <!-- JJK THEMED MUSIC PLAYER PANEL (TOP RIGHT) -->
        <div class="music-panel">
            <h3>🎵 CURSED OST STREAM</h3>
            <p>Lost In Paradise[cite: 1]</p>
            <div class="iframe-container">
                <iframe src="https://www.youtube.com/embed/KJWrvoMlHvY?si=NFYEo_HQVLq-L9fH" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>

    </div>

    <script src="gojo.js"></script>
</body>
</html>
